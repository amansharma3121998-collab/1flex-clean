<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoviesBox - Stream Movies & TV Shows</title>
    <meta
      name="description"
      content="MoviesBox - Your ultimate streaming destination. Watch movies and TV shows in high definition with seamless playback."
    />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Block aggressive popups and tab hijacks from video embeds
      const originalOpen = window.open;
      window.open = function (url, target, features) {
        console.warn("Blocked popup redirect:", url);
        return null;
      };

      // Prevent dynamic injection of ad scripts and tracking iframes
      const originalCreateElement = document.createElement;
      document.createElement = function (tagName) {
        const el = originalCreateElement.call(document, tagName);
        if (tagName.toLowerCase() === "iframe" || tagName.toLowerCase() === "script") {
          const originalSetAttribute = el.setAttribute;
          el.setAttribute = function (name, value) {
            if (
              name === "src" &&
              (value.includes("layla.wtf") ||
                value.includes("fubuki") ||
                value.includes("monetag") ||
                value.includes("adsterra") ||
                value.includes("pop"))
            ) {
              console.warn("Blocked injected ad element:", value);
              return;
            }
            return originalSetAttribute.call(el, name, value);
          };
        }
        return el;
      };
    </script>
  </head>
  <body class="bg-black text-white font-sans selection:bg-red-600 selection:text-white antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
